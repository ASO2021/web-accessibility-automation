[pytest]
pythonpath = .
testpaths = tests
addopts = -v -s --html=reports/pytest_report.html --self-contained-html
markers =
    unit: tests sin navegador, validan la logica del reporte
    demo: compara una pagina inaccesible con su version corregida
    audit: escanea una pagina y genera el reporte, sin fallar por violaciones
    keyboard: pruebas de navegacion solo con teclado
